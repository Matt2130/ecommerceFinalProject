version: '3.8'
services:
  rabbitmq-ecommerce:
    image: rabbitmq:management
    container_name: rabbitmq-ecommerce
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=ecom-admin
      - RABBITMQ_DEFAULT_PASS=ecom-admin
    networks:
      - ecommerce_network

  mysql-ecommerce:
    image: mysql:8.0
    container_name: mysql-ecommerce
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ecom-pass
      MYSQL_DATABASE: ecommerce
      MYSQL_USER: ecom-user
      MYSQL_PASSWORD: ecom-pass
    volumes:
      - mysql_ecommerce_data:/var/lib/mysql
    restart: always
    networks:
      - ecommerce_network

volumes:
  mysql_ecommerce_data:

networks:
  ecommerce_network:
    driver: bridge
    name: ecommerce_network